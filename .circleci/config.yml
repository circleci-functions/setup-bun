version: 2.1

functions:
  # The released version, run the way a user's job would: proves the upload,
  # the per-platform binary and the published flags.
  bun: github.com/circleci-functions/setup-bun@v0.1.0

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  prerelease:
    type: boolean
    default: false
    description: >-
      Publish this branch as a pre-release instead of running the full suite
      (see RELEASE.md). Set it when triggering a pipeline from the UI.
  bun-version:
    type: string
    default: "1.4.5"
    description: >-
      Bun version for the acceptance and smoke tests to install.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # For the smoke jobs. cimg/base has no Go and no Bun, so it proves setup-bun
  # installs from nothing. Alpine is the musl build; macOS and Windows are
  # where PATH and linking differ from Linux.
  base:
    docker:
      - image: cimg/base:stable
  alpine:
    docker:
      - image: alpine:3.22
  arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
  macos:
    macos:
      xcode: "16.4.0"
  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe -eo pipefail
    resource_class: windows.medium

commands:
  smoke:
    description: >-
      Let setup-bun pick where bun goes on this executor's real PATH, then
      resolve bun and bunx by name in processes that sourced nothing.

      Everything runs from the workspace, so the executor needs no Go, no
      modules and no checkout: the suite is a cross-compiled test binary, and
      test2json and gotestsum turn its output into the JUnit CircleCI collects.
    parameters:
      platform:
        type: string
        description: The os/arch whose artifacts to run, e.g. linux/amd64.
      ext:
        type: string
        default: ""
        description: Executable suffix for the platform.
    steps:
      - run:
          name: Install Bun onto PATH and resolve it afterwards
          command: |
            mkdir -p test-results
            # standard-verbose keeps the suite's own output in the log: which
            # directory setup-bun chose is the thing worth reading even when
            # the check passes.
            ./dist/tools/<< parameters.platform >>/gotestsum<< parameters.ext >> \
              --junitfile test-results/smoke.xml \
              --format standard-verbose \
              --raw-command -- \
              ./dist/tools/<< parameters.platform >>/test2json<< parameters.ext >> \
                -p acceptance \
                ./dist/acceptance/<< parameters.platform >>/acceptance<< parameters.ext >> \
                -test.v=test2json -test.run TestAcceptance_InstallsOntoTheRealPath
          environment:
            SETUP_BUN_BINARY: ./dist/setup-bun/<< parameters.platform >>/setup-bun<< parameters.ext >>
            SETUP_BUN_ACCEPTANCE_VERSION: << pipeline.parameters.bun-version >>
      - store_test_results:
          path: test-results

jobs:
  test:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-bun-go-{{ checksum "go.sum" }}-
            - setup-bun-go-
      - run: task lint
      # A release is the only thing that runs `task publish`, so a missing task
      # would otherwise surface at release time.
      - run: task lint-tasks
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-bun-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-bun into ./dist and persists it to the workspace, so
  # the smoke jobs exercise exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-bun-go-{{ checksum "go.sum" }}-
            - setup-bun-go-
      - run: task dry-run
      # The suite as a binary, plus the tools to report it, so an executor with
      # no Go can run and record it.
      - run: task build-acceptance
      - run: task build-tools
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Real Bun downloads, the real npm registry and a real task-agent cache.
  acceptance:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-bun-go-{{ checksum "go.sum" }}-
            - setup-bun-go-
      - run:
          name: Run acceptance tests
          # The real-PATH test is the smoke jobs' to run.
          command: task acceptance -- -skip '^TestAcceptance_InstallsOntoTheRealPath$'
          environment:
            SETUP_BUN_ACCEPTANCE_VERSION: << pipeline.parameters.bun-version >>
            # Use the job's own cache rather than the in-memory stand-in, so the
            # round-trips here exercise the real thing.
            TOOLKIT_CACHE_MODE: live
      - store_test_results:
          path: test-results

  # Each of these runs the packaged suite against the packaged artifact, so
  # the executor needs no Go, no modules and no checkout. `task smoke-local`
  # reproduces the Linux amd64 one in a container.
  smoke-linux-amd64:
    executor: base
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  # Bun's musl build needs the C++ runtime, which Alpine doesn't ship.
  smoke-alpine:
    executor: alpine
    steps:
      - run: apk add --no-cache libstdc++ libgcc
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  smoke-linux-arm64:
    executor: arm64
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/arm64

  smoke-macos:
    executor: macos
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: darwin/arm64

  smoke-windows:
    executor: windows
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: windows/amd64
          ext: ".exe"

  published:
    executor: base
    steps:
      - checkout
      - bun:
          with:
            bun-version: "1.4.2"
      - run:
          name: bun and bunx are the version asked for
          command: |
            test "$(bun --version)" = 1.4.2
            test "$(bunx --version)" = 1.4.2
      - bun/install-packages:
          with:
            app-dir: internal/testing/testdata/bun
      - run:
          name: The frozen install put the packages in node_modules
          command: test -f internal/testing/testdata/bun/node_modules/is-odd/package.json

workflows:
  test-publish:
    when:
      not: << pipeline.parameters.prerelease >>
    jobs:
      - test
      - build
      - acceptance
      - smoke-linux-amd64:
          requires: [build]
      - smoke-alpine:
          requires: [build]
      - smoke-linux-arm64:
          requires: [build]
      - smoke-macos:
          requires: [build]
      - smoke-windows:
          requires: [build]
      - published
      - toolkit/release-pr:
          name: release-pr
          executor: go
          cache-prefix: setup-bun-go
          # One at a time, so two pushes can't race to rewrite release/next.
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires
            - test
            - acceptance
            - smoke-linux-amd64
            - smoke-alpine
            - smoke-linux-arm64
            - smoke-macos
            - smoke-windows
          context: [github-release]
          filters:
            branches:
              only: main
      - toolkit/publish:
          name: publish
          executor: go
          cache-prefix: setup-bun-go
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main

  # Triggered by hand, so it skips the smoke jobs: the pre-release is what gets
  # tested. Only maintainers can publish one.
  prerelease:
    when: << pipeline.parameters.prerelease >>
    jobs:
      - test
      - build
      - toolkit/publish-prerelease:
          name: publish-prerelease
          executor: go
          cache-prefix: setup-bun-go
          requires: [test, build]
          context: [functions-prerelease]
